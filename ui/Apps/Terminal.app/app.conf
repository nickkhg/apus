# The manifest of an app bundle. The compositor reads it when it starts, and
# the dock shows one icon for each bundle in /Applications.
#
#   id     what the app gives in xdg_toplevel.set_app_id
#   name   the name in the dock; its first letter is in the icon
#   exec   the program, in the bundle or an absolute path
#   color  the colour of the icon, RRGGBB
id = org.apus.terminal
name = Terminal
exec = bin/apus-terminal
color = 3BB273
