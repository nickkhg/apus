# The sound card of the virtual machine (virtio_snd), for PipeWire.
#
# The card has the speakers of the Mac as PCM 0, and the microphone as
# PCM 1 when apus-vm gives it one (VM_AUDIO=mic). The default profiles look
# for a microphone on PCM 0 only, so they find none, and the card then has
# a sink and no source. These two mappings name the two PCMs.
#
# auto-profiles makes a profile from each mapping that opens, and one from
# the two together. A card with no microphone therefore gets the speakers
# alone. /usr/lib/udev/rules.d/90-apus-virtio-snd.rules gives the
# card this file. See docs/audio.md.

[General]
auto-profiles = yes

[Mapping speakers]
description = Speakers
device-strings = hw:%f,0
channel-map = left,right
direction = output
priority = 10

[Mapping microphone]
description = Microphone
device-strings = hw:%f,1
channel-map = mono
direction = input
priority = 10
