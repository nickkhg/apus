# A key, and nothing else, gets in.
#
# root on an Apus machine has no password at all, and a login with an empty
# password is refused anyway. So the only way in is a key in
# /root/.ssh/authorized_keys, which apus-ssh-key.service puts there from the
# directory that the VM shares, and which exists on no other machine.
PermitRootLogin prohibit-password
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
